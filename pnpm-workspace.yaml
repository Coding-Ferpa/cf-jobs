# Configuração do pnpm 11. Do 11 em diante ele **não lê mais o campo `pnpm` do
# package.json** — overrides e afins moram aqui (doc 01, virada agendada para o
# M8).
#
# Não há `packages:` porque o projeto não é monorepo: este arquivo existe pela
# configuração, não pelo workspace.

# Supply chain (doc 07, A08): **desligado por decisão do mantenedor** (ADR-0019).
#
# `minimumReleaseAge` recusa pacote publicado há menos do intervalo, em minutos.
# Esteve em 1440 (24 h) do M8 até a atualização de dependências que a seguiu,
# quando oito pacotes lançados no mesmo dia foram barrados e o mantenedor optou
# por atualizá-los na hora.
#
# Zero significa sem espera: um pacote comprometido publicado agora entra no
# lockfile sem resistência, que é o ataque que o intervalo cobria. Voltar a
# proteger é trocar este número — nada mais depende dele.
minimumReleaseAge: 0

overrides:
  # Vulnerabilidades transitivas de produção, zeradas por override (ADR-0011).
  # São dependências do `next`; sair delas por conta própria é o preço de não
  # esperar o upstream.
  postcss: ^8.5.24
  sharp: ^0.35.3

  # Avisos do `pnpm audit` corrigidos por versão, não por exceção. Os três são
  # patch dentro da mesma major: o menor risco de quebra possível.
  #
  # `fast-uri` é a única que importa para o gate bloqueante — ela chega por
  # `@hookform/resolvers > ajv`, que é dependência de produção
  # (GHSA-7p8r-x3mc-p8w7, confusão de host por barra invertida).
  fast-uri: ^3.1.5
  # GHSA-ph9p-34f9-6g65 e GHSA-52f5-9888-hmc6, as duas por `@lhci/cli`.
  tmp: ^0.2.6
  # GHSA-w5hq-g745-h8pq. Escopada ao `@lhci/cli` porque o `uuid` já vai na 14 e
  # forçar a major nova no resto da árvore trocaria um aviso por um erro de
  # execução.
  '@lhci/cli>uuid': ^11.1.1
  # GHSA-jmr9-qjv8-65gv no `extract-zip`, que **não tem versão corrigida** — o
  # aviso pede >=2.0.2 e a última publicada é a 2.0.1. A saída é subir quem o
  # puxa: o `@puppeteer/browsers` deixou de depender dele na 3.0.0. Chega por
  # `@lhci/cli > lighthouse > puppeteer-core`, então só o Lighthouse é afetado —
  # e se a troca quebrar o launcher do Chrome, o job do Lighthouse falha alto.
  '@puppeteer/browsers': ^3.2.1
  # Peer que a 3.x do `@puppeteer/browsers` passou a exigir (>=8.0.1). Só o
  # `@lhci/cli` e o próprio puppeteer o usam, e apenas para baixar navegador
  # através de proxy — coisa que nem o CI nem a máquina de ninguém faz aqui.
  proxy-agent: ^8.0.2

# Script de instalação só roda com autorização explícita — é a defesa contra o
# pacote que executa código na máquina de quem instala. O pnpm 11 pede decisão
# de cada um: `true` libera, `false` recusa e para de perguntar.
allowBuilds:
  # Binário nativo do Tailwind v4; sem ele o CSS não compila.
  '@tailwindcss/oxide': true
  # Compilador do vite/tsx — todo o tooling de teste depende dele.
  esbuild: true
  # Processamento de imagem do `next/image`.
  sharp: true
  # Resolvedor nativo usado pelo ESLint.
  unrs-resolver: true
  # Baixa o binário que o `withSentryConfig` usa para subir source map no build
  # de produção (doc 09). Sem `SENTRY_AUTH_TOKEN` ninguém o chama, mas quando o
  # token existe o binário precisa estar lá.
  '@sentry/cli': true
  # Chega via recharts e serve para alternar entre Vue 2 e 3. Não há Vue aqui:
  # rodar o script seria dar execução a um pacote que o projeto não usa.
  vue-demi: false
