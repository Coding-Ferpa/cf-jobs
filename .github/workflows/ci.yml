name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# O job `lighthouse` entra no M3, quando existir área pública para medir
# (docs 11 e 12).
jobs:
  quality:
    name: Lint, tipos e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: .env.example em sincronia com o schema de env
        run: pnpm check:env
      # Bloqueia no que vai para produção (doc 07 — A06). Avisos em dependências
      # de desenvolvimento aparecem no passo seguinte sem derrubar o PR — ver
      # docs/adr/0011-escopo-do-gate-de-pnpm-audit.md.
      - name: Auditoria de dependências de produção
        run: pnpm audit --prod --audit-level high
      - name: Auditoria completa (informativa)
        continue-on-error: true
        run: pnpm audit --audit-level high

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Valida as mensagens de commit do PR
        run: >
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  db:
    name: Banco de dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sobe o Supabase local
        run: pnpm db:start
      - name: Aplica as migrations do zero e o seed
        run: pnpm db:reset
      - name: Policies e funções (pgTAP)
        run: pnpm db:test
      - name: Schema Drizzle em sincronia com o banco
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm check:schema
      - name: Derruba o Supabase
        if: ${{ always() }}
        run: pnpm db:stop

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instala o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium
      # Login, papéis e guard do admin precisam de banco de verdade.
      - name: Sobe o Supabase local
        run: pnpm db:start
      - name: Aponta o app para o Supabase local
        run: |
          # O comando também imprime linhas de status; só as VARIAVEL="valor" servem.
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "DIRECT_URL=$DB_URL"
            echo "NVIDIA_API_KEY=nao-usada-no-e2e"
            echo "CRON_SECRET=segredo-de-teste-do-ci-cfjobs"
          } >> "$GITHUB_ENV"
      # O build roda pelo webServer do playwright.config.ts.
      - run: pnpm test:e2e
      - name: Derruba o Supabase
        if: ${{ always() }}
        run: pnpm db:stop
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
